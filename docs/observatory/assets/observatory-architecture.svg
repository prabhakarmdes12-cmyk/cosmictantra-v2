<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">CosmicTantra Observatory architecture blueprint</title>
  <desc id="desc">A flow diagram from Panchang and URL inputs through astronomy engines into four Observatory instruments and a shared detail-sheet interaction layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050713"/><stop offset="1" stop-color="#101735"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#D4AF37"/><stop offset="1" stop-color="#F2C65D"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#26265B"/><stop offset="1" stop-color="#171A45"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#F2C65D"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#9EA8FF"/></marker>
    <style>
      .title { font: 700 27px 'JetBrains Mono', monospace; letter-spacing: 4px; fill: #F7F1DF; }
      .subtitle { font: 12px 'JetBrains Mono', monospace; letter-spacing: 1.4px; fill: #99A4C7; }
      .section { font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 2px; fill: #F2C65D; }
      .boxTitle { font: 700 15px Inter, sans-serif; fill: #F1F3FF; }
      .boxText { font: 11px Inter, sans-serif; fill: #AFB8D5; }
      .mono { font: 10px 'JetBrains Mono', monospace; fill: #9EA8FF; }
      .small { font: 10px Inter, sans-serif; fill: #8993B0; }
    </style>
  </defs>
  <rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <path d="M42 112 H1398" stroke="#FFFFFF" stroke-opacity=".1"/>
  <circle cx="1330" cy="66" r="4" fill="#D4AF37" filter="url(#glow)"/><circle cx="1360" cy="82" r="2" fill="#C5C9FF"/><circle cx="1300" cy="92" r="2" fill="#C5C9FF"/>
  <text x="52" y="58" class="title">COSMICTANTRA · OBSERVATORY</text>
  <text x="52" y="85" class="subtitle">A deterministic local-sky instrument · one canonical coordinate pipeline · four focused views</text>

  <text x="52" y="145" class="section">01 · CONTEXT INPUTS</text>
  <g transform="translate(52 165)">
    <rect width="285" height="112" rx="16" fill="#0D1224" stroke="#D4AF37" stroke-opacity=".55"/>
    <circle cx="28" cy="29" r="12" fill="#D4AF37" fill-opacity=".18" stroke="#F2C65D"/><text x="28" y="34" text-anchor="middle" class="boxTitle">1</text>
    <text x="52" y="34" class="boxTitle">Panchang deep link</text>
    <text x="22" y="61" class="boxText">City page supplies a city id and ISO</text><text x="22" y="78" class="boxText">observation instant to the Observatory.</text><text x="22" y="99" class="mono">?city=patna&amp;time=…</text>
  </g>
  <g transform="translate(52 297)">
    <rect width="285" height="112" rx="16" fill="#0D1224" stroke="#D4AF37" stroke-opacity=".55"/>
    <circle cx="28" cy="29" r="12" fill="#D4AF37" fill-opacity=".18" stroke="#F2C65D"/><text x="28" y="34" text-anchor="middle" class="boxTitle">2</text>
    <text x="52" y="34" class="boxTitle">Observer controls</text>
    <text x="22" y="61" class="boxText">City, city-local time, quick presets,</text><text x="22" y="78" class="boxText">and one-hour stepping define context.</text><text x="22" y="99" class="mono">lat · longitude · fixed UTC offset</text>
  </g>
  <g transform="translate(52 429)">
    <rect width="285" height="112" rx="16" fill="#0D1224" stroke="#D4AF37" stroke-opacity=".55"/>
    <circle cx="28" cy="29" r="12" fill="#D4AF37" fill-opacity=".18" stroke="#F2C65D"/><text x="28" y="34" text-anchor="middle" class="boxTitle">3</text>
    <text x="52" y="34" class="boxTitle">Share / restore state</text>
    <text x="22" y="61" class="boxText">Selected object and context can be</text><text x="22" y="78" class="boxText">reopened from a validated query.</text><text x="22" y="99" class="mono">object · objectKind · planet</text>
  </g>

  <path d="M337 221 C390 221 390 264 435 264" fill="none" stroke="#F2C65D" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <path d="M337 353 C390 353 390 300 435 300" fill="none" stroke="#F2C65D" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <path d="M337 485 C392 485 394 335 435 335" fill="none" stroke="#F2C65D" stroke-width="2" marker-end="url(#arrow-gold)"/>

  <text x="435" y="145" class="section">02 · CANONICAL ASTRONOMY CORE</text>
  <g transform="translate(435 165)">
    <rect width="315" height="376" rx="20" fill="url(#violet)" stroke="#9EA8FF" stroke-opacity=".6"/>
    <text x="24" y="38" class="boxTitle">Coordinate + body services</text>
    <text x="24" y="61" class="small">src/lib/astronomy/</text>
    <path d="M24 83 H291" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle cx="34" cy="111" r="5" fill="#F2C65D"/><text x="52" y="116" class="boxText">70 J2000 bright-star anchors</text>
    <circle cx="34" cy="145" r="5" fill="#F2C65D"/><text x="52" y="150" class="boxText">Precession to of-date coordinates</text>
    <circle cx="34" cy="179" r="5" fill="#F2C65D"/><text x="52" y="184" class="boxText">Greenwich / local sidereal time</text>
    <circle cx="34" cy="213" r="5" fill="#F2C65D"/><text x="52" y="218" class="boxText">Altitude, azimuth, stereographic map</text>
    <circle cx="34" cy="247" r="5" fill="#F2C65D"/><text x="52" y="252" class="boxText">Keplerian visible-body positions</text>
    <circle cx="34" cy="281" r="5" fill="#F2C65D"/><text x="52" y="286" class="boxText">Solar + compact lunar approximations</text>
    <circle cx="34" cy="315" r="5" fill="#F2C65D"/><text x="52" y="320" class="boxText">Mean Rahu / Ketu nodes + Lahiri</text>
    <text x="24" y="355" class="mono">tropical → sidereal → rashi / nakshatra</text>
  </g>

  <path d="M750 264 C800 264 800 210 842 210" fill="none" stroke="#9EA8FF" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M750 300 C800 300 800 300 842 300" fill="none" stroke="#9EA8FF" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M750 336 C800 336 800 390 842 390" fill="none" stroke="#9EA8FF" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <text x="842" y="145" class="section">03 · INSTRUMENT ROUTES</text>
  <g transform="translate(842 165)">
    <rect width="250" height="82" rx="16" fill="#0D1224" stroke="#8B8BF5" stroke-opacity=".65"/><text x="20" y="30" class="boxTitle">Local Observatory</text><text x="20" y="52" class="boxText">Sky map · rail · layers · readout</text><text x="20" y="70" class="mono">/observatory</text>
  </g>
  <g transform="translate(1120 165)">
    <rect width="250" height="82" rx="16" fill="#0D1224" stroke="#8B8BF5" stroke-opacity=".65"/><text x="20" y="30" class="boxTitle">Ecliptic Instrument</text><text x="20" y="52" class="boxText">12 rashis · 27 nakshatras · 9 grahas</text><text x="20" y="70" class="mono">/observatory/ecliptic</text>
  </g>
  <g transform="translate(842 274)">
    <rect width="250" height="82" rx="16" fill="#0D1224" stroke="#8B8BF5" stroke-opacity=".65"/><text x="20" y="30" class="boxTitle">Sky Time Machine</text><text x="20" y="52" class="boxText">Birth → now interpolation trace</text><text x="20" y="70" class="mono">/observatory/timemachine</text>
  </g>
  <g transform="translate(1120 274)">
    <rect width="250" height="82" rx="16" fill="#0D1224" stroke="#8B8BF5" stroke-opacity=".65"/><text x="20" y="30" class="boxTitle">Gochara</text><text x="20" y="52" class="boxText">Natal/current rashi comparison</text><text x="20" y="70" class="mono">/observatory/gochara</text>
  </g>
  <g transform="translate(842 383)">
    <rect width="528" height="82" rx="16" fill="#0D1224" stroke="#D4AF37" stroke-opacity=".65"/><text x="20" y="30" class="boxTitle">Shared field interaction layer</text><text x="20" y="52" class="boxText">Canvas hit targets · keyboard selectors · canonical selection · responsive detail sheet</text><text x="20" y="70" class="mono">CelestialSelection → CelestialArtwork → CelestialDetailSheet</text>
  </g>
  <path d="M1090 247 V383" fill="none" stroke="#8B8BF5" stroke-opacity=".65" stroke-dasharray="5 6"/><path d="M1245 356 V383" fill="none" stroke="#8B8BF5" stroke-opacity=".65" stroke-dasharray="5 6"/>

  <text x="52" y="620" class="section">04 · VERIFICATION + RELEASE GUARDRAILS</text>
  <g transform="translate(52 644)">
    <rect width="1318" height="110" rx="18" fill="#090D1A" stroke="#FFFFFF" stroke-opacity=".14"/>
    <text x="24" y="34" class="boxTitle">Deterministic and transparent by default</text>
    <text x="24" y="59" class="boxText">25 Observatory tests · 13 existing engine/feature tests · route smoke checks · no live sky request in the browser</text>
    <text x="24" y="82" class="boxText">Release status: CONDITIONAL PASS · Moon discrepancy 1.135216° · JPL Horizons fixture still requires networked reference generation</text>
    <text x="24" y="101" class="mono">typecheck · tests/observatory.spec.ts · test:engines · npm run reference:generate</text>
  </g>
</svg>
