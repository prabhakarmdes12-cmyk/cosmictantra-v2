<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9B6A13"/>
      <stop offset="48%" stop-color="#D1A72E"/>
      <stop offset="100%" stop-color="#A8581C"/>
    </linearGradient>
  </defs>

  <g id="symbol" transform="translate(700 150)" fill="none" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- corner brackets -->
    <path d="M-92 -74 H-132 V-34 M92 -74 H132 V-34 M-92 74 H-132 V34 M92 74 H132 V34"/>
    <!-- directional triangles -->
    <path d="M0 -132 L-15 -112 H15 Z M132 0 L112 -15 V15 Z M0 132 L-15 112 H15 Z M-132 0 L-112 -15 V15 Z"/>
    <!-- orbit circles -->
    <circle cx="0" cy="0" r="80" stroke-dasharray="3 8"/>
    <circle cx="0" cy="0" r="57"/>
    <circle cx="0" cy="0" r="24"/>
    <!-- axes -->
    <path d="M0 -94 V94 M-94 0 H94"/>
    <!-- cardinal nodes -->
    <circle cx="0" cy="-94" r="6" fill="#FFF8E9"/>
    <circle cx="94" cy="0" r="6" fill="#FFF8E9"/>
    <circle cx="0" cy="94" r="6" fill="#FFF8E9"/>
    <circle cx="-94" cy="0" r="6" fill="#FFF8E9"/>
    <!-- inner ticks -->
    <path d="M-40 -40 l-7 -7 M40 -40 l7 -7 M40 40 l7 7 M-40 40 l-7 7"/>
    <circle cx="0" cy="0" r="11" fill="url(#gold)" stroke="none"/>
  </g>

  <text x="700" y="352" text-anchor="middle" fill="#111111"
        font-family="GFS Didot, Didot, 'Times New Roman', serif" font-size="94" font-weight="400" letter-spacing="12">COSMICTANTRA</text>

  <g stroke="url(#gold)" stroke-width="1.5" fill="url(#gold)">
    <path d="M490 404 H600 M800 404 H910"/>
    <path d="M700 398 l8 8 -8 8 -8 -8z"/>
    <circle cx="680" cy="404" r="2.5" stroke="none"/>
    <circle cx="720" cy="404" r="2.5" stroke="none"/>
  </g>

  <text x="700" y="463" text-anchor="middle" fill="#B08419"
        font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" letter-spacing="14">VEDIC PRECISION</text>
</svg>
